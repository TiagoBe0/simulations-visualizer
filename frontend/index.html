<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Visualizador de dumps LAMMPS</title>
<style>
  :root { --bg:#f4f5f7; --panel:#ffffff; --line:#d4d8de; --txt:#1c2128;
          --accent:#1e6fe0; --field:#f7f8fa; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--txt);
              font:13px/1.4 system-ui,Segoe UI,Roboto,sans-serif; overflow:hidden; }
  #app { display:flex; height:100%; }
  #view { flex:1; position:relative; }
  #view canvas { display:block; }
  #panel { width:300px; background:var(--panel); border-left:1px solid var(--line);
           padding:14px; overflow-y:auto; }
  #panel h1 { font-size:14px; margin:0 0 12px; font-weight:600; }
  .grp { border-top:1px solid var(--line); padding:12px 0; }
  .grp:first-of-type { border-top:0; padding-top:0; }
  label { display:block; margin:8px 0 3px; color:#5b6470; font-size:11px;
          text-transform:uppercase; letter-spacing:.04em; }
  select, input[type=number], input[type=text], input[type=search] {
          width:100%; background:var(--field); color:var(--txt);
          border:1px solid var(--line); border-radius:5px; padding:6px; }
  .tree { margin-top:6px; max-height:260px; overflow:auto; user-select:none;
          background:var(--field); border:1px solid var(--line);
          border-radius:5px; padding:4px 0; }
  .tnode { display:flex; align-items:center; gap:4px; cursor:pointer;
           white-space:nowrap; font-size:12px; padding:3px 8px 3px 0;
           line-height:1.5; }
  .tnode:hover { background:#eef1f5; }
  .tnode.sel { background:#dceaff; color:var(--accent); font-weight:600; }
  .tcaret { flex:0 0 12px; text-align:center; color:#8a929d; font-size:10px; }
  .ticon  { flex:0 0 15px; text-align:center; color:#8a929d; font-size:11px; }
  .tnode.sel .ticon { color:var(--accent); }
  .tlabel { flex:0 1 auto; overflow:hidden; text-overflow:ellipsis; }
  .tmeta  { margin-left:auto; padding-left:10px; color:#8a929d;
            font-size:10px; font-variant-numeric:tabular-nums; }
  .tnode.sel .tmeta { color:var(--accent); }
  .tempty { color:#8a929d; font-size:11px; padding:8px; }
  #runCount { color:#8a929d; font-size:10px; margin-top:4px; }
  #runFiles { margin-top:10px; }
  .fbtn { display:flex; align-items:center; gap:7px; width:100%;
          text-align:left; background:var(--field); color:var(--txt);
          border:1px solid var(--line); border-radius:5px; padding:6px 8px;
          margin-top:4px; cursor:pointer; font-size:12px; }
  .fbtn:hover { border-color:var(--accent); color:var(--accent); }
  .fbtn .ficon { flex:0 0 auto; color:#8a929d; }
  .fbtn:hover .ficon { color:var(--accent); }
  .fbtn .flabel { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #fileView { position:fixed; inset:0; z-index:20; display:none;
              align-items:center; justify-content:center; padding:32px;
              background:rgba(28,33,40,.45); }
  #fileBox { background:var(--panel); border:1px solid var(--line);
             border-radius:8px; width:min(920px,100%); max-height:100%;
             display:flex; flex-direction:column;
             box-shadow:0 10px 34px rgba(0,0,0,.22); }
  #fileHead { display:flex; align-items:center; gap:12px; padding:10px 14px;
              border-bottom:1px solid var(--line); }
  #fileName { flex:1; font-weight:600; font-size:13px; overflow:hidden;
              text-overflow:ellipsis; white-space:nowrap; }
  #fileHead a, #fileClose { background:var(--field); color:var(--txt);
               border:1px solid var(--line); border-radius:5px;
               padding:4px 10px; cursor:pointer; font-size:13px;
               text-decoration:none; }
  #fileHead a:hover, #fileClose:hover { border-color:var(--accent);
               color:var(--accent); }
  .dlbtn { width:100%; margin-top:8px; background:var(--field);
           color:var(--txt); border:1px solid var(--line);
           border-radius:5px; padding:7px; cursor:pointer; font-size:12px; }
  .dlbtn:hover { border-color:var(--accent); color:var(--accent); }
  .dlbtn:disabled { opacity:.5; cursor:default; }
  #fileBody { margin:0; padding:14px; overflow:auto; font-size:12px;
              line-height:1.45; white-space:pre; tab-size:4;
              font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
  input[type=range] { width:100%; }
  .row { display:flex; gap:8px; }
  .row > * { flex:1; }
  .chk { display:flex; align-items:center; gap:6px; margin:8px 0 3px; }
  .chk label { margin:0; }
  .val { color:var(--accent); font-variant-numeric:tabular-nums; }
  #hud { position:absolute; left:12px; top:12px; background:rgba(255,255,255,.82);
         border:1px solid var(--line); padding:7px 10px; border-radius:6px;
         font-size:12px; pointer-events:none; }
  #loading { position:absolute; inset:0; display:none; align-items:center;
             justify-content:center; background:rgba(244,245,247,.65); font-size:14px; }

  /* Tabs */
  #tabBar { display:flex; gap:4px; margin-bottom:12px; }
  .tab { flex:1; background:var(--field); color:var(--txt);
         border:1px solid var(--line); border-radius:5px;
         padding:6px; cursor:pointer; font-size:12px; font-weight:500; }
  .tab.active { background:var(--accent); color:#fff; border-color:var(--accent); }
  .tab:hover:not(.active) { border-color:var(--accent); color:var(--accent); }

  /* Figures panel */
  #figPanel { display:none; padding-top:2px; }
  .tnode.fig-img { cursor:pointer; }
  .tnode.fig-img .ticon { color:#1e6fe0; }
  .tnode.fig-img:hover { background:#eef1f5; }
  .tnode.fig-other { opacity:.5; cursor:default; }
  .tnode.fig-other:hover { background:none; }

  /* Image viewer modal */
  #imageView { position:fixed; inset:0; z-index:30; display:none;
               flex-direction:column; background:rgba(12,14,18,.92); }
  #imageHead { display:flex; align-items:center; gap:10px; padding:9px 14px;
               border-bottom:1px solid rgba(255,255,255,.12); flex-shrink:0; }
  #imageName { flex:1; font-size:12px; color:#9aa5b4; overflow:hidden;
               text-overflow:ellipsis; white-space:nowrap; }
  #imageHead a, #imageClose { background:rgba(255,255,255,.1); color:#c9d1d9;
               border:1px solid rgba(255,255,255,.18); border-radius:5px;
               padding:4px 10px; cursor:pointer; font-size:12px;
               text-decoration:none; white-space:nowrap; }
  #imageHead a:hover, #imageClose:hover { background:rgba(255,255,255,.2); color:#fff; }
  #imageBody { flex:1; overflow:hidden; position:relative; cursor:grab;
               display:flex; align-items:center; justify-content:center;
               touch-action:none; }
  #imageBody.dragging { cursor:grabbing; }
  #imageEl { max-width:90vw; max-height:85vh; object-fit:contain; display:block;
             transform-origin:center center; user-select:none; pointer-events:none;
             transition:none; }
  #imageZoomLbl { position:absolute; bottom:10px; left:12px;
                  color:rgba(255,255,255,.45); font-size:11px; pointer-events:none; }
  #imageZoomReset { position:absolute; bottom:10px; right:12px;
                    background:rgba(255,255,255,.12); color:rgba(255,255,255,.7);
                    border:1px solid rgba(255,255,255,.18); border-radius:5px;
                    padding:3px 9px; cursor:pointer; font-size:11px; }
  #imageZoomReset:hover { background:rgba(255,255,255,.22); }
</style>
</head>
<body>
<div id="app">
  <div id="view">
    <div id="hud">—</div>
    <div id="loading">Cargando…</div>
  </div>
  <div id="panel">
    <div id="tabBar">
      <button id="tabSim" class="tab active">Simulaciones</button>
      <button id="tabFig" class="tab">Figuras</button>
    </div>

  <div id="simPanel">
    <div class="grp">
      <label>Corrida</label>
      <input type="search" id="runSearch" placeholder="Buscar simulación…"
             autocomplete="off" />
      <div id="runTree" class="tree"></div>
      <div id="runCount"></div>
      <div id="runFiles"></div>
      <label>Timestep <span class="val" id="stepLbl"></span></label>
      <input type="range" id="step" min="0" max="0" step="1" />
      <div class="row" style="margin-top:8px">
        <button id="play" style="background:var(--accent);color:#fff;border:0;border-radius:5px;padding:7px;cursor:pointer;font-weight:600">▶ Reproducir</button>
        <button id="stepBack" title="Anterior" style="flex:0 0 38px;background:var(--field);color:var(--txt);border:1px solid var(--line);border-radius:5px;padding:7px;cursor:pointer">⏮</button>
        <button id="stepFwd" title="Siguiente" style="flex:0 0 38px;background:var(--field);color:var(--txt);border:1px solid var(--line);border-radius:5px;padding:7px;cursor:pointer">⏭</button>
      </div>
      <div class="chk"><input type="checkbox" id="loopOn" checked /><label for="loopOn">Repetir en bucle</label></div>
      <label>Velocidad <span class="val" id="fpsLbl"></span> fps</label>
      <input type="range" id="fps" min="1" max="30" step="1" value="6" />
      <button id="frameDl" class="dlbtn" title="Descargar el dump de este timestep">⤓ Descargar este frame</button>
    </div>

    <div class="grp">
      <label>Colorear por</label>
      <select id="field"></select>
      <label>Paleta</label>
      <select id="cmap">
        <option value="0">Turbo</option>
        <option value="1">Viridis</option>
        <option value="2">Escala de grises</option>
      </select>
      <div class="row">
        <div><label>Mín</label><input type="number" id="vmin" step="any" /></div>
        <div><label>Máx</label><input type="number" id="vmax" step="any" /></div>
      </div>
      <button id="vreset" style="margin-top:8px;width:100%;background:var(--field);color:var(--txt);border:1px solid var(--line);border-radius:5px;padding:6px;cursor:pointer">Auto rango</button>
    </div>

    <div class="grp">
      <div class="chk"><input type="checkbox" id="filtOn" /><label for="filtOn">Filtrar por rango</label></div>
      <label>Histograma <span class="val" id="histInfo"></span></label>
      <canvas id="hist" width="272" height="120"
              style="width:100%;height:120px;background:var(--field);border:1px solid var(--line);border-radius:5px;cursor:crosshair;touch-action:none"></canvas>
      <div style="font-size:10px;color:#8a929d;margin-top:4px">Arrastrá para seleccionar un rango · doble clic para limpiar</div>
      <div class="chk"><input type="checkbox" id="histLog" /><label for="histLog">Eje Y logarítmico</label></div>
      <div class="row">
        <div><label>Desde</label><input type="number" id="fmin" step="any" /></div>
        <div><label>Hasta</label><input type="number" id="fmax" step="any" /></div>
      </div>
    </div>

    <div class="grp">
      <label>Plano de corte</label>
      <select id="sliceAxis">
        <option value="-1">Sin corte</option>
        <option value="0">Eje X</option>
        <option value="1">Eje Y</option>
        <option value="2">Eje Z</option>
      </select>
      <label>Posición <span class="val" id="sliceLbl"></span></label>
      <input type="range" id="slicePos" min="0" max="1" step="0.001" value="0.5" />
      <label>Espesor <span class="val" id="sliceThickLbl"></span></label>
      <input type="range" id="sliceThick" min="0.005" max="1" step="0.005" value="0.1" />
      <div class="chk"><input type="checkbox" id="sliceFlip" /><label for="sliceFlip">Invertir (excluir lámina)</label></div>
    </div>

    <div class="grp">
      <label>Tamaño de punto <span class="val" id="psLbl"></span></label>
      <input type="range" id="psize" min="0.2" max="6" step="0.1" value="1.6" />
      <div class="chk"><input type="checkbox" id="boxOn" checked /><label for="boxOn">Mostrar caja</label></div>
    </div>
  </div><!-- /simPanel -->

  <div id="figPanel">
    <div class="grp" style="border-top:0;padding-top:0">
      <label>Buscar figura</label>
      <input type="search" id="figSearch" placeholder="Buscar archivo o carpeta…"
             autocomplete="off" />
      <div id="figTree" class="tree" style="max-height:calc(100vh - 160px)"></div>
    </div>
  </div><!-- /figPanel -->

  </div><!-- /panel -->
</div>

<div id="fileView">
  <div id="fileBox">
    <div id="fileHead">
      <span id="fileName"></span>
      <a id="fileDl" download title="Descargar archivo">⤓ Descargar</a>
      <button id="fileClose" title="Cerrar (Esc)">✕ Cerrar</button>
    </div>
    <pre id="fileBody"></pre>
  </div>
</div>

<div id="imageView">
  <div id="imageHead">
    <span id="imageName"></span>
    <a id="imageDl" download title="Descargar imagen">⤓ Descargar</a>
    <button id="imageClose" title="Cerrar (Esc)">✕ Cerrar</button>
  </div>
  <div id="imageBody">
    <img id="imageEl" alt="" />
    <span id="imageZoomLbl">100%</span>
    <button id="imageZoomReset" title="Restaurar vista (doble clic)">⌂ Encuadrar</button>
  </div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>
<script type="module" src="app.js"></script>
</body>
</html>
